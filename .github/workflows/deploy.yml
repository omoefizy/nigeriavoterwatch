name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch so fast-follows don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — Hash chain integrity (runs on EVERY push, every branch)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  hash-chain:
    name: Hash Chain Integrity
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Install only what the hash chain module needs — no Playwright/Tesseract.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pydantic==2.10.3 \
            pydantic-settings==2.7.0 \
            python-dotenv==1.0.1 \
            pytest==8.3.4 \
            structlog==24.4.0

      - name: Run hash chain tests
        env:
          GENESIS_BLOCK_SEED: ${{ secrets.GENESIS_BLOCK_SEED || 'ci-test-genesis-2027' }}
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB_NAME: test_nigeriavoterwatch
          JWT_SECRET_KEY: ci-test-jwt-secret
          APP_SECRET_KEY: ci-test-app-secret
        run: python -m pytest tests/test_hash_chain.py -v --tb=short

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — Full backend test suite (runs on every push)
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: hash-chain

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (excluding scraper / browser tests)
        env:
          GENESIS_BLOCK_SEED: ${{ secrets.GENESIS_BLOCK_SEED || 'ci-test-genesis-2027' }}
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB_NAME: test_nigeriavoterwatch
          JWT_SECRET_KEY: ci-test-jwt-secret
          APP_SECRET_KEY: ci-test-app-secret
        # -m "not playwright and not integration" skips tests that need a live
        # browser or database. Remove the -m flag once you add a MongoDB service.
        run: python -m pytest tests/ -v --tb=short -m "not playwright and not integration"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 — Deploy backend to Railway  (main branch only)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: [hash-chain, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_SERVICE_NAME }}" \
            --environment production \
            --detach

# ─────────────────────────────────────────────────────────────────────────────
# Job 4 — Deploy frontend to Vercel  (main branch only)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [hash-chain, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pull Vercel project settings (output directory, env vars, etc.)
      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Build with production env vars baked in (VITE_API_URL comes from Vercel dashboard)
      - name: Build
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Upload the prebuilt output — fast, no re-build on Vercel servers
      - name: Deploy prebuilt output
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
